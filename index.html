<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO Замер Потолков</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131b2e;
            --accent: #00d2ff;
            --accent-gradient: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .logo-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .attempts-counter {
            font-size: 13px;
            color: var(--success);
            background: rgba(34, 197, 94, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .canvas-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
        }

        .canvas-card.fullscreen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999;
            border-radius: 0;
            max-width: none;
            padding: 16px;
            background: #070a12;
            justify-content: space-between;
        }

        .canvas-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .action-hint {
            font-size: 13px;
            color: var(--accent);
            font-weight: 500;
        }

        .fullscreen-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        canvas {
            width: 100%;
            height: 260px;
            background: #070a12;
            border-radius: 10px;
            border: 1px solid var(--border);
            touch-action: none;
            cursor: crosshair;
        }

        .canvas-card.fullscreen canvas {
            height: calc(100vh - 140px);
        }

        .canvas-tools {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .section-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-group label {
            font-size: 11px;
            color: var(--text-muted);
        }

        .input-field {
            background: #070a12;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: white;
            padding: 8px 10px;
            font-size: 13px;
            width: 100%;
        }

        .input-field:focus { border-color: var(--accent); outline: none; }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 9px 6px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--accent-gradient); border: none; color: #0b0f19; }
        .btn-danger { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.3); color: span(--danger); color: #ef4444; }
        .btn-success { background: rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.4); color: #22c55e; }

        .item-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 6px;
            align-items: center;
        }

        .item-row label { font-size: 12px; color: var(--text-main); }

        .result-card {
            background: linear-gradient(145deg, #131b2e 0%, #1a2744 100%);
            border-radius: 16px;
            border: 1px solid #2a3b5e;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }

        .result-row span:last-child { color: white; font-weight: 600; }

        .total-price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: 4px;
        }

        .total-price span { font-size: 15px; font-weight: 700; }
        .total-price .price-value { font-size: 22px; color: var(--accent); }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo-title">📐 PRO Замер</div>
            <div class="attempts-counter" id="attemptsCounter">PRO Версия активна ✨</div>
        </header>

        <div class="canvas-card" id="canvasCard">
            <div class="canvas-header">
                <span class="action-hint" id="actionHint">Удерживайте и тащите углы (A, B, C, D) пальцем</span>
                <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ На весь экран</button>
            </div>
            <canvas id="sketchCanvas"></canvas>
            <div class="canvas-tools">
                <button class="btn btn-danger" onclick="resetSketch()">🗑️ Сброс</button>
                <button class="btn btn-success" onclick="buildFromNumbers()">📐 Построить по цифрам</button>
            </div>
        </div>

        <div class="section-card" id="wallsCard">
            <div class="section-title">📏 Длины стен комнаты (см):</div>
            <div class="grid-inputs" id="wallsInputsContainer">
                <div class="input-group">
                    <label>Стена А-В (см)</label>
                    <input type="number" class="input-field wall-len" id="len-0" value="400" step="1" oninput="buildFromNumbers()">
                </div>
                <div class="input-group">
                    <label>Стена В-С (см)</label>
                    <input type="number" class="input-field wall-len" id="len-1" value="300" step="1" oninput="buildFromNumbers()">
                </div>
                <div class="input-group">
                    <label>Стена С-D (см)</label>
                    <input type="number" class="input-field wall-len" id="len-2" value="400" step="1" oninput="buildFromNumbers()">
                </div>
                <div class="input-group">
                    <label>Стена D-A (см)</label>
                    <input type="number" class="input-field wall-len" id="len-3" value="300" step="1" oninput="buildFromNumbers()">
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">⚙️ Материалы и Базовые работы</div>
            <div class="grid-inputs">
                <div class="input-group">
                    <label>Полотно (₽/м²)</label>
                    <input type="number" id="priceCanvas" class="input-field" value="650">
                </div>
                <div class="input-group">
                    <label>Багет (₽/м.п.)</label>
                    <input type="number" id="priceProfile" class="input-field" value="250">
                </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 6px;">
                <div class="item-row">
                    <label>Светильники (шт)</label>
                    <input type="number" id="countLights" class="input-field" value="4">
                    <input type="number" id="priceLight" class="input-field" value="450">
                </div>
                <div class="item-row">
                    <label>Люстра (шт)</label>
                    <input type="number" id="countChandeliers" class="input-field" value="1">
                    <input type="number" id="priceChandelier" class="input-field" value="600">
                </div>
                <div class="item-row">
                    <label>Карниз (м.п.)</label>
                    <input type="number" id="countCornice" class="input-field" value="3.0">
                    <input type="number" id="priceCornice" class="input-field" value="700">
                </div>
                <div class="item-row">
                    <label>Обход труб (шт)</label>
                    <input type="number" id="countPipes" class="input-field" value="1">
                    <input type="number" id="pricePipe" class="input-field" value="350">
                </div>
                <div class="item-row">
                    <label>Доп. углы (&gt;4)</label>
                    <input type="number" id="countAngles" class="input-field" value="0">
                    <input type="number" id="priceAngle" class="input-field" value="150">
                </div>
            </div>
        </div>

        <div class="section-card">
            <div class="section-title">➕ Дополнительные работы (свои)</div>
            <div class="grid-inputs">
                <input type="text" id="customName1" class="input-field" placeholder="Например: Брус под гардину" value="Брус под гардину">
                <input type="number" id="customPrice1" class="input-field" placeholder="Цена ₽" value="0">
                <input type="text" id="customName2" class="input-field" placeholder="Например: Обход короба" value="Обход короба">
                <input type="number" id="customPrice2" class="input-field" placeholder="Цена ₽" value="0">
            </div>
        </div>

        <div class="result-card">
            <div class="result-row">
                <span>Площадь комнаты:</span>
                <span id="resArea">—</span>
            </div>
            <div class="result-row">
                <span>Периметр (багет):</span>
                <span id="resPerimeter" style="color: var(--accent); font-weight: 700;">—</span>
            </div>
            <div class="result-row">
                <span>Монтаж и комплектующие:</span>
                <span id="resMounting">—</span>
            </div>
            
            <div class="total-price">
                <span>ИТОГО К ОПЛАТЕ:</span>
                <span class="price-value" id="resTotal">—</span>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="calculate()" style="padding: 12px; font-size: 14px;">🧮 РАССЧИТАТЬ</button>
                <button class="btn" onclick="shareEstimate()" style="padding: 12px; font-size: 14px;">📤 Отправить смету</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('sketchCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.clientWidth || 350;
            canvas.height = canvas.clientHeight || 260;
            buildFromNumbers();
        }

        window.addEventListener('resize', resizeCanvas);
        setTimeout(resizeCanvas, 100);

        function toggleFullscreen() {
            document.getElementById('canvasCard').classList.toggle('fullscreen');
            resizeCanvas();
        }

        let points = [
            { x: 80, y: 60, label: 'A' },
            { x: 270, y: 60, label: 'B' },
            { x: 270, y: 200, label: 'C' },
            { x: 80, y: 200, label: 'D' }
        ];

        let draggedPoint = null;

        // Построение по цифрам из таблицы
        function buildFromNumbers() {
            let inputs = document.querySelectorAll('.wall-len');
            if (inputs.length < 4) return;

            let ab = parseFloat(inputs[0].value) || 400;
            let bc = parseFloat(inputs[1].value) || 300;

            let maxDim = Math.max(ab, bc);
            let scale = (Math.min(canvas.width, canvas.height) * 0.55) / maxDim;

            let drawW = ab * scale;
            let drawH = bc * scale;

            let startX = (canvas.width - drawW) / 2;
            let startY = (canvas.height - drawH) / 2;

            points[0] = { x: startX, y: startY, label: 'A' };
            points[1] = { x: startX + drawW, y: startY, label: 'B' };
            points[2] = { x: startX + drawW, y: startY + drawH, label: 'C' };
            points[3] = { x: startX, y: startY + drawH, label: 'D' };

            drawSketch();
        }

        // Перетаскивание точек пальцем
        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            points.forEach((p) => {
                let dist = Math.hypot(p.x - x, p.y - y);
                if (dist < 25) {
                    draggedPoint = p;
                }
            });
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!draggedPoint) return;
            const rect = canvas.getBoundingClientRect();
            draggedPoint.x = Math.max(20, Math.min(canvas.width - 20, e.clientX - rect.left));
            draggedPoint.y = Math.max(20, Math.min(canvas.height - 20, e.clientY - rect.top));

            updateTableFromDrawing();
            drawSketch();
        });

        canvas.addEventListener('pointerup', () => {
            draggedPoint = null;
        });

        // Обновление цифр в таблице при растягивании чертежа
        function updateTableFromDrawing() {
            let pixelLen0 = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
            let pixelLen1 = Math.hypot(points[2].x - points[1].x, points[2].y - points[1].y);
            let pixelLen2 = Math.hypot(points[3].x - points[2].x, points[3].y - points[2].y);
            let pixelLen3 = Math.hypot(points[0].x - points[3].x, points[0].y - points[3].y);

            let baseCm = parseFloat(document.getElementById('len-0').value) || 400;
            let basePx = pixelLen0 > 0 ? pixelLen0 : 150;
            let ratio = baseCm / basePx;

            document.getElementById('len-0').value = Math.round(pixelLen0 * ratio);
            document.getElementById('len-1').value = Math.round(pixelLen1 * ratio);
            document.getElementById('len-2').value = Math.round(pixelLen2 * ratio);
            document.getElementById('len-3').value = Math.round(pixelLen3 * ratio);
        }

        function drawSketch() {
            if (!canvas.width || !canvas.height) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Сетка
            ctx.strokeStyle = '#162035';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 20) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += 20) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Комната
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            ctx.closePath();
            
            ctx.fillStyle = 'rgba(0, 210, 255, 0.08)';
            ctx.fill();
            ctx.strokeStyle = '#00d2ff';
            ctx.lineWidth = 2.5;
            ctx.stroke();

            let inputs = document.querySelectorAll('.wall-len');

            // Отрисовка точек, букв и размеров на отрезках
            points.forEach((p, index) => {
                let nextP = points[(index + 1) % points.length];
                let lenCm = inputs[index] ? inputs[index].value : '0';

                // Текст с расстоянием посередине отрезка
                let midX = (p.x + nextP.x) / 2;
                let midY = (p.y + nextP.y) / 2;

                ctx.fillStyle = '#f59e0b';
                ctx.font = 'bold 12px Segoe UI';
                ctx.fillText(`${lenCm} см`, midX - 15, midY - 6);

                // Точка угла
                ctx.fillStyle = '#00d2ff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 13px Segoe UI';
                ctx.fillText(p.label, p.x + 10, p.y - 10);
            });
        }

        function resetSketch() {
            document.getElementById('len-0').value = 400;
            document.getElementById('len-1').value = 300;
            document.getElementById('len-2').value = 400;
            document.getElementById('len-3').value = 300;
            buildFromNumbers();
        }

        function calculate() {
            let roomPerimCm = 0;
            document.querySelectorAll('.wall-len').forEach(input => {
                roomPerimCm += parseFloat(input.value) || 0;
            });

            let roomPerimeterM = roomPerimCm / 100;
            let ab = (parseFloat(document.getElementById('len-0').value) || 400) / 100;
            let bc = (parseFloat(document.getElementById('len-1').value) || 300) / 100;
            let area = ab * bc; // Упрощенный расчет площади прямоугольника по сторонам

            let pCanvas = parseFloat(document.getElementById('priceCanvas').value) || 0;
            let pProfile = parseFloat(document.getElementById('priceProfile').value) || 0;

            let cLights = parseFloat(document.getElementById('countLights').value) || 0;
            let pLight = parseFloat(document.getElementById('priceLight').value) || 0;

            let cChandeliers = parseFloat(document.getElementById('countChandeliers').value) || 0;
            let pChandelier = parseFloat(document.getElementById('priceChandelier').value) || 0;

            let cCornice = parseFloat(document.getElementById('countCornice').value) || 0;
            let pCornice = parseFloat(document.getElementById('priceCornice').value) || 0;

            let cPipes = parseFloat(document.getElementById('countPipes').value) || 0;
            let pPipe = parseFloat(document.getElementById('pricePipe').value) || 0;

            let cAngles = parseFloat(document.getElementById('countAngles').value) || 0;
            let pAngle = parseFloat(document.getElementById('priceAngle').value) || 0;

            let custom1 = parseFloat(document.getElementById('customPrice1').value) || 0;
            let custom2 = parseFloat(document.getElementById('customPrice2').value) || 0;

            let canvasCost = area * pCanvas;
            let profileCost = roomPerimeterM * pProfile;
            let mountingCost = (cLights * pLight) + (cChandeliers * pChandelier) + (cCornice * pCornice) + (cPipes * pPipe) + (cAngles * pAngle) + custom1 + custom2;
            let total = canvasCost + profileCost + mountingCost;

            document.getElementById('resArea').innerText = area.toFixed(2) + ' м²';
            document.getElementById('resPerimeter').innerText = roomPerimeterM.toFixed(2) + ' м';
            document.getElementById('resMounting').innerText = Math.round(mountingCost).toLocaleString() + ' ₽';
            document.getElementById('resTotal').innerText = Math.round(total).toLocaleString() + ' ₽';
        }

        function shareEstimate() {
            let total = document.getElementById('resTotal').innerText;
            if (total === '—') {
                alert('Сначала выполните расчет кнопкой «Рассчитать»!');
                return;
            }
            let area = document.getElementById('resArea').innerText;
            let baget = document.getElementById('resPerimeter').innerText;

            let text = `📋 Смета на натяжной потолок:%0A` +
                       `• Площадь полотна: ${area}%0A` +
                       `• Периметр (багет): ${baget}%0A` +
                       `• Итого к оплате: ${total}%0A%0A` +
                       `Рассчитано в приложении PRO Замер`;

            if (navigator.share) {
                navigator.share({ title: 'Смета потолка', text: decodeURIComponent(text.replace(/%0A/g, '\n')) }).catch(() => {});
            } else {
                window.open(`https://wa.me/?text=${text}`, '_blank');
            }
        }
    </script>
</body>
</html>
